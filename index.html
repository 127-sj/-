<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 지뢰찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }
        .cell-unrevealed {
            background-color: #e2e8f0;
            border: 3px solid;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-bottom-color: #94a3b8;
            border-right-color: #94a3b8;
        }
        .cell-unrevealed:active {
            border: none;
        }
        .cell-revealed {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }
        .mine {
            background-color: #ef4444 ! from;
        }
        .num-1 { color: #2563eb; }
        .num-2 { color: #16a34a; }
        .num-3 { color: #dc2626; }
        .num-4 { color: #1e1b4b; }
        .num-5 { color: #7f1d1d; }
        .num-6 { color: #0891b2; }
        .num-7 { color: #000000; }
        .num-8 { color: #4b5563; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4 font-sans text-slate-700">

    <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200 w-full max-w-fit overflow-auto">
        
        <!-- Header Controls -->
        <div class="flex flex-wrap items-center justify-between mb-6 gap-4 min-w-[300px]">
            <div class="relative">
                <select id="levelSelect" class="appearance-none bg-slate-50 hover:bg-slate-100 px-4 py-2 pr-8 rounded-lg border border-slate-200 transition-colors font-medium text-slate-700 cursor-pointer focus:outline-none">
                    <option value="BEGINNER">초급</option>
                    <option value="INTERMEDIATE">중급</option>
                    <option value="EXPERT">고급</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-red-50 text-red-600 px-3 py-1.5 rounded-full font-bold">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path></svg>
                    <span id="mineCountDisplay">010</span>
                </div>
                
                <button id="resetBtn" class="p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-full transition-all active:scale-90 shadow-md">
                    <svg id="resetIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001
