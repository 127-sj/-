<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 지뢰찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }
        /* 3D 효과를 위한 테두리 스타일 */
        .cell-unrevealed {
            background-color: #cbd5e1;
            border: 3px solid;
            border-top-color: #f8fafc;
            border-left-color: #f8fafc;
            border-bottom-color: #64748b;
            border-right-color: #64748b;
        }
        .cell-revealed {
            background-color: #e2e8f0;
            border: 1px solid #94a3b8;
        }
        .mine-hit {
            background-color: #ef4444 !important;
        }
        /* 숫자별 색상 정의 */
        .num-1 { color: #2563eb; }
        .num-2 { color: #16a34a; }
        .num-3 { color: #dc2626; }
        .num-4 { color: #1e1b4b; }
        .num-5 { color: #7f1d1d; }
        .num-6 { color: #0891b2; }
        .num-7 { color: #334155; }
        .num-8 { color: #000000; }
    </style>
</head>
<body class="min-h-screen bg-slate-200 flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-slate-300 p-4 rounded-lg shadow-2xl border-4 border-slate-400">
        <!-- 상단 바: 지뢰 수, 리셋 버튼, 타이머 -->
        <div class="flex items-center justify-between bg-slate-400 p-3 rounded mb-4 shadow-inner border-b-2 border-slate-500">
            <div class="bg-black text-red-500 font-mono text-2xl px-2 py-1 rounded border-2 border-slate-500 w-20 text-center" id="mineCountDisplay">
                010
            </div>
            
            <button id="resetBtn" class="bg-slate-300 hover:bg-slate-200 border-4 border-t-slate-100 border-l-slate-100 border-b-slate-500 border-r-slate-500 active:border-none p-1 transition-all">
                <span id="faceIcon" class="text-3xl">🙂</span>
            </button>

            <div class="bg-black text-red-500 font-mono text-2xl px-2 py-1 rounded border-2 border-slate-500 w-20 text-center" id="timerDisplay">
                000
            </div>
        </div>

        <!-- 난이도 선택 -->
        <div class="flex justify-center mb-4 gap-2">
            <select id="levelSelect" class="bg-slate-100 border-2 border-slate-400 rounded px-2 py-1 text-sm font-bold">
                <option value="BEGINNER">초급 (9x9)</option>
                <option value="INTERMEDIATE">중급 (16x16)</option>
                <option value="EXPERT">고급 (30x16)</option>
            </select>
        </div>

        <!-- 게임 그리드 -->
        <div class="bg-slate-400 p-1 border-4 border-slate-500 rounded shadow-inner overflow-auto max-w-[95vw] max-h-[70vh]">
            <div id="gameGrid" class="grid gap-0" style="width: max-content;"></div>
        </div>

        <!-- 안내 문구 -->
        <div class="mt-4 text-center text-xs text-slate-600 font-semibold">
            좌클릭: 열기 | 우클릭: 깃발 🚩
        </div>
    </div>

    <script>
        const LEVELS = {
            BEGINNER: { rows: 9, cols: 9, mines: 10 },
            INTERMEDIATE: { rows: 16, cols: 16, mines: 40 },
            EXPERT: { rows: 16, cols: 30, mines: 99 }
        };

        let currentLevel = LEVELS.BEGINNER;
        let grid = [];
        let gameState = 'ready'; // ready, playing, won, lost
        let minesLeft = 10;
        let time = 0;
        let timerInterval = null;

        const gridElement = document.getElementById('gameGrid');
        const levelSelect = document.getElementById('levelSelect');
        const mineCountDisplay = document.getElementById('mineCountDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const resetBtn = document.getElementById('resetBtn');
        const faceIcon = document.getElementById('faceIcon');

        function initGame() {
            const levelKey = levelSelect.value;
            currentLevel = LEVELS[levelKey];
            gameState = 'ready';
            minesLeft = currentLevel.mines;
            time = 0;
            clearInterval(timerInterval);
            
            updateDisplay();
            faceIcon.innerText = '🙂';
            
            grid = [];
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${currentLevel.cols}, 32px)`;

            for (let r = 0; r < currentLevel.rows; r++) {
                grid[r] = [];
                for (let c = 0; c < currentLevel.cols; c++) {
                    const cellObj = {
                        r, c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    };

                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell cell-unrevealed';
                    
                    // 우클릭 방지
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    // 좌클릭
                    cellEl.addEventListener('click', (e) => {
                        handleLeftClick(r, c);
                    });
                    
                    gridElement.appendChild(cellEl);
                    cellObj.element = cellEl;
                    grid[r][c] = cellObj;
                }
            }
        }

        function startGame(firstR, firstC) {
            // 지뢰 배치 (첫 클릭 지점과 그 주변 8칸 제외)
            let minesPlaced = 0;
            while (minesPlaced < currentLevel.mines) {
                const r = Math.floor(Math.random() * currentLevel.rows);
                const c = Math.floor(Math.random() * currentLevel.cols);
                
                const isNearFirstClick = Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1;
                
                if (!grid[r][c].isMine && !isNearFirstClick) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // 주변 지뢰 개수 계산
            for (let r = 0; r < currentLevel.rows; r++) {
                for (let c = 0; c < currentLevel.cols; c++) {
                    if (grid[r][c].isMine) continue;
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            if (grid[r + i]?.[c + j]?.isMine) count++;
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }

            gameState = 'playing';
            timerInterval = setInterval(() => {
                time = Math.min(time + 1, 999);
                updateDisplay();
            }, 1000);

            revealCell(firstR, firstC);
        }

        function handleLeftClick(r, c) {
            if (gameState === 'won' || gameState === 'lost') return;
            if (grid[r][c].isFlagged) return;

            if (gameState === 'ready') {
                startGame(r, c);
            } else {
                revealCell(r, c);
            }
        }

        function handleRightClick(r, c) {
            if (gameState !== 'playing' && gameState !== 'ready') return;
            const cell = grid[r][c];
            if (cell.isRevealed) return;
            
            cell.isFlagged = !cell.isFlagged;
            minesLeft += cell.isFlagged ? -1 : 1;
            updateDisplay();
            renderCell(cell);
        }

        function revealCell(r, c) {
            const cell = grid[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            renderCell(cell);

            if (cell.isMine) {
                endGame(false, r, c);
                return;
            }

            if (cell.neighborMines === 0) {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (grid[r + i]?.[c + j]) {
                            revealCell(r + i, c + j);
                        }
                    }
                }
            }

            checkWin();
        }

        function renderCell(cell) {
            const el = cell.element;
            if (cell.isRevealed) {
                el.className = 'cell cell-revealed';
                if (cell.isMine) {
                    el.innerHTML = '💣';
                } else if (cell.neighborMines > 0) {
                    el.innerHTML = cell.neighborMines;
                    el.classList.add(`num-${cell.neighborMines}`);
                } else {
                    el.innerHTML = '';
                }
            } else {
                el.className = 'cell cell-unrevealed';
                el.innerHTML = cell.isFlagged ? '🚩' : '';
            }
        }

        function updateDisplay() {
            mineCountDisplay.innerText = String(Math.max(0, minesLeft)).padStart(3, '0');
            timerDisplay.innerText = String(time).padStart(3, '0');
        }

        function checkWin() {
            let unrevealedNonMines = 0;
            for (let r = 0; r < currentLevel.rows; r++) {
                for (let c = 0; c < currentLevel.cols; c++) {
                    if (!grid[r][c].isMine && !grid[r][c].isRevealed) unrevealedNonMines++;
                }
            }

            if (unrevealedNonMines === 0) {
                endGame(true);
            }
        }

        function endGame(won, hitR, hitC) {
            gameState = won ? 'won' : 'lost';
            clearInterval(timerInterval);
            faceIcon.innerText = won ? '😎' : '😵';
            
            // 모든 지뢰 공개
            for (let r = 0; r < currentLevel.rows; r++) {
                for (let c = 0; c < currentLevel.cols; c++) {
                    const cell = grid[r][c];
                    if (cell.isMine) {
                        cell.isRevealed = true;
                        renderCell(cell);
                        if (!won && r === hitR && c === hitC) {
                            cell.element.classList.add('mine-hit');
                        }
                    } else if (!won && cell.isFlagged) {
                        // 잘못 깃발 꽂은 곳 표시
                        cell.element.innerHTML = '❌';
                    }
                }
            }
        }

        levelSelect.addEventListener('change', initGame);
        resetBtn.addEventListener('click', initGame);

        // 초기 게임 실행
        window.onload = initGame;
    </script>
</body>
</html>
